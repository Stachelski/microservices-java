spring.application.name=currency-service
server.port=8100

spring.datasource.url=jdbc:postgresql://localhost/db_currency
spring.datasource.username=postgres
spring.datasource.password=33694506Caio_

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.locations=classpath:/db_migration

#Self Registration Pattern
eureka.client.service-url.default-zone=http://localhost:8761/eureka
#Ideal para ambiente containerizados
eureka.instance.prefer-ip-address=true
#Personalizar o Id de cada instância
eureka.instance.instance-id=${spring.application.name}:${server.port}
#Indicar que o Service Registry deve validar a saúde do serviço através do actuator, e não somente Heartbeat
#Opcional - Valor Default = TRUE
eureka.client.healthcheck.enabled=true

#Configuração mínima para atuação com o Service Registry de forma consistente
management.endpoints.web.exposure.include=health,info,metrics,circuit-breakers,circuit-breaker-events
#ATENÇÂO: Cuidado ao expor esses dados
#Exibir todas as informações de saúde da aplicação
management.endpoint.health.show-details=always
#Exibir informações no endpoint /actuator/info
management.info.env.anabled=true

#Personalização de informações do endpoint /actuator/info
info.app.name=${spring.application.name}
info.app.description=Currency Conversion Microservice
info.app.autor=Caio Stachelski


#Personalização de Metadatas para o Eureka Service Registry
eureka.instance.metadata-map.github.repo=Stachelski/microservices-java

#Definir a utilização das Probes Liveness = exibição de informações de componentes diversos
#Opcional: Padrão já é TRUE
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true


management.info.env.enabled=true

spring.cache.type=caffeine
spring.cache.cache-names=currencies

spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=60s

spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=2000

resilience4j.retry.instances.bcbService.max-attempts=3
resilience4j.retry.instances.bcbService.wait-duration=2s
resilience4j.retry.instances.bcbService.enable-exponential-backoff=true
resilience4j.retry.instances.bcbService.exponential-backoff-multiplier=2
resilience4j.retry.instances.bcbService.enable-randomized-wait=true

resilience4j.circuitbreaker.instances.bcbService.sliding-window-size=10
resilience4j.circuitbreaker.instances.bcbService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bcbService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.bcbService.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.timelimiter.instances.bcbService.timeout-duration=2s